<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Manuscript field -->
  <rect class="ii-field" x="12" y="12" width="76" height="76"/>

  <!-- Double outer frame -->
