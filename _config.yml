# Site settings
title: Hasan Tayyar Beşik 
email: tayyar.besik@gmail.com
description: "IPA: ˈHɑː-sɑːn Tɑːy-yɑːr Bɛˑ-ʃik"
baseurl: ""
url: "https://hasantayyar.net/"
twitter_username: htayyar
github_username:  hasantayyar
medium_username: htayyar

# Bump css_version and rename css/site-*.css when styles change (CDN cache bust).
css_version: "20260823"

# Build settings
highlighter: rouge
markdown: redcarpet
permalink: pretty

# Exclude: vendor, archive folder with Turkish-char filenames (cause rb_sysopen errors)
exclude:
  - vendor
  - "assets/www.turkiyedepunkveyeraltikaynaklarininkesintilitarihi.com-archive"

collections:
  - medium_posts

plugins:
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 10
  permalink: "/feed/page/:num/"
  title: ":title - page :num"
  sort_field: date
  sort_reverse: true

