---
layout: notes
---
{% include category-list.html %}

<p class="category-summary">{{ page.posts.size }} post{% if page.posts.size != 1 %}s{% endif %} in <strong>{{ page.title }}</strong>.</p>

<ol class="home-latest posts">
  {% for post in page.posts %}
    {% include feed-proto.html post=post %}
    {% include post-item.html post=post %}
  {% endfor %}
</ol>

<p class="notes-back"><a href="{{ site.baseurl }}/feed/">← All notes</a></p>
