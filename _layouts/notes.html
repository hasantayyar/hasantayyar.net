<!DOCTYPE html>
<html lang="en">
  <head>
    {% include theme-init.html %}
    {% include dark-head.html %}
  </head>
  <body class="site page-notes">
    {% assign home_href = site.baseurl | append: '/' %}
    {% include site-header.html back=home_href label='← Home' %}
    <main class="site-main site-main--wide">
      <article class="site-article">
        <h1 class="page-title">{{ page.title }}</h1>
        {{ content }}
      </article>
    </main>
    {% include site-scripts.html %}
  </body>
</html>
